name: CO1 source-bound cosmology replay

on:
  push:
    branches: [main, physics-ph1-ph2-response-holonomy]
    paths:
      - 'physics/co1/**'
      - 'physics/tp1/tp1_frame_defect_law.py'
      - 'physics/cv1/cv1_frame_curvature.py'
      - '.github/workflows/physics-co1.yml'
  pull_request:
    paths:
      - 'physics/co1/**'
      - 'physics/tp1/tp1_frame_defect_law.py'
      - 'physics/cv1/cv1_frame_curvature.py'
      - '.github/workflows/physics-co1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: extra-ideas
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Parveen117/Publications
          ref: f0f1c1650e914b7eaf3bf64ddb7df9f543c92a56
          path: publications
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            papers/ugd-kahler-propagation/COUPLED_COSMOLOGICAL_SOLUTION.md
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned symbolic runtime
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Replay CO1, check source pins and frozen evidence
        run: python -B extra-ideas/physics/co1/verify.py --publications-root publications
      - name: Evidence remains unchanged
        working-directory: extra-ideas
        run: git diff --exit-code
